[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "judikt"
version = "0.3.0"
description = "A deterministic security and reliability control plane for MCP tool execution."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gaurav GS" }]
license = { text = "Apache-2.0" }
keywords = ["mcp", "security", "llmops", "ai-agents", "policy-as-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/gaurav-gs7/Judikt"
Documentation = "https://github.com/gaurav-gs7/Judikt#readme"
Issues = "https://github.com/gaurav-gs7/Judikt/issues"

[project.scripts]
judikt = "judikt.cli:main"
# Compatibility aliases retained for pre-Judikt local configurations.
gatetrace-mcp = "judikt.cli:main"
mcp-guard = "judikt.cli:main"

[project.optional-dependencies]
mcp = [
  "mcp>=1.28.1,<2",
  "pydantic-settings>=2.14.2,<3",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.30,<1",
]
observability = [
  "openinference-semantic-conventions>=0.1.30,<0.2",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]
auth = [
  "cryptography>=50.0.0,<51",
  "PyJWT[crypto]>=2.10,<3",
]
redis = [
  "redis>=5,<7",
]
benchmark = [
  "pyarrow>=18,<22",
]
aws = [
  "boto3>=1.34,<2",
]
test = [
  "coverage[toml]>=7.6,<8",
]
quality = [
  "pip-audit>=2.10,<3",
  "ruff==0.15.22",
]
media = [
  "Pillow>=11,<13",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"judikt.resources" = ["*.json"]
