name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build --outdir python-dist
      - run: python scripts/verify_wheel.py python-dist/*.whl
      - name: Validate and build version-matched skill
        run: >-
          python scripts/build_skill_release.py
          --output-dir skill-dist
          --release-tag "${{ github.event.release.tag_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: python-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: judikt-mcp-security-skill
          path: skill-dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/judikt/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-skill:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: judikt-mcp-security-skill
          path: skill-dist/
      - name: Attach versioned skill ZIP to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" skill-dist/*.zip --clobber
