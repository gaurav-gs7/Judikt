{{- if and (gt (int .Values.replicaCount) 1) (not .Values.redis.url) }}
{{- fail "replicaCount > 1 requires redis.url: approval tokens must stay single-use across replicas, and the SQLite replay store is per pod" }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) .Values.persistence.enabled }}
{{- fail "replicaCount > 1 cannot share one persistence volume: each pod keeps its own SQLite audit chain. Set persistence.enabled=false and ship audit events to an external sink (audit.sink), or run a single replica" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "judikt.fullname" . }}
  labels:
    {{- include "judikt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "judikt.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "judikt.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "judikt.serviceAccountName" . }}
      containers:
        - name: judikt
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JUDIKT_MODE
              value: real-mcp
            {{- if not .Values.redis.url }}
            # One replica without Redis: approval replay protection uses the
            # pod's SQLite store, which is only safe for a single instance.
            - name: JUDIKT_SINGLE_INSTANCE
              value: "true"
            {{- end }}
            - name: JUDIKT_APPROVAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_APPROVAL_SECRET
            - name: JUDIKT_HTTP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_HTTP_BEARER_TOKEN
            - name: JUDIKT_JWT_HS256_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_JWT_HS256_SECRET
            - name: JUDIKT_AUDIT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_AUDIT_HMAC_SECRET
            - name: JUDIKT_AUDIT_SIGNATURE_REQUIRED
              value: {{ .Values.audit.signatureRequired | quote }}
            - name: JUDIKT_AUDIT_VERIFY_ON_STARTUP
              value: {{ .Values.audit.verifyOnStartup | quote }}
            - name: JUDIKT_AUDIT_SINK
              value: {{ .Values.audit.sink | quote }}
            - name: JUDIKT_AUDIT_SINK_STRICT
              value: {{ .Values.audit.sinkStrict | quote }}
            - name: JUDIKT_JWT_ISSUER
              value: {{ .Values.auth.jwtIssuer | quote }}
            - name: JUDIKT_JWT_AUDIENCE
              value: {{ .Values.auth.jwtAudience | quote }}
            - name: JUDIKT_JWT_REQUIRED_GROUP
              value: {{ .Values.auth.jwtRequiredGroup | quote }}
            - name: JUDIKT_JWT_JWKS_URL
              value: {{ .Values.auth.jwtJwksUrl | quote }}
            - name: JUDIKT_RESOURCE_URI
              value: {{ .Values.auth.resourceUri | quote }}
            - name: JUDIKT_AUTHORIZATION_SERVER
              value: {{ .Values.auth.authorizationServer | quote }}
            - name: JUDIKT_REQUIRED_SCOPES
              value: {{ .Values.auth.requiredScopes | quote }}
            - name: JUDIKT_ADMIN_SCOPE
              value: {{ .Values.auth.adminScope | quote }}
            - name: JUDIKT_ALLOWED_ORIGINS
              value: {{ .Values.auth.allowedOrigins | quote }}
            - name: JUDIKT_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: JUDIKT_REDIS_REQUIRED
              value: {{ .Values.redis.required | quote }}
            {{- if .Values.redis.url }}
            # Share kill switches across replicas instead of per-pod SQLite.
            - name: JUDIKT_KILL_SWITCH_BACKEND
              value: redis
            {{- end }}
            - name: JUDIKT_ARGUS_URL
              value: {{ .Values.argus.url | quote }}
            - name: JUDIKT_ARGUS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_ARGUS_API_TOKEN
            - name: JUDIKT_ARGUS_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_ARGUS_HMAC_SECRET
            - name: JUDIKT_ARGUS_ALLOW_INSECURE_HTTP
              value: {{ .Values.argus.allowInsecureHttp | quote }}
            - name: JUDIKT_SIEM_URL
              value: {{ .Values.siem.url | quote }}
            - name: JUDIKT_SIEM_PROTOCOL
              value: {{ .Values.siem.protocol | quote }}
            - name: JUDIKT_SIEM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_SIEM_TOKEN
            - name: JUDIKT_SIEM_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_SIEM_HMAC_SECRET
            - name: JUDIKT_SIEM_TIMEOUT_SECONDS
              value: {{ .Values.siem.timeoutSeconds | quote }}
            - name: JUDIKT_SIEM_ALLOW_INSECURE_HTTP
              value: {{ .Values.siem.allowInsecureHttp | quote }}
            - name: JUDIKT_TELEMETRY
              value: {{ .Values.telemetry.mode | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Judikt keeps its audit chain, replay store, kill switches and
            # pins under /app/data. The root filesystem is read-only, so the
            # data volume is always mounted: a PVC when persistence is enabled,
            # otherwise an emptyDir that lasts for the pod's lifetime.
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "judikt.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
