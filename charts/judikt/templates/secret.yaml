{{- $approvalSecret := required "approvalSecret is required" .Values.approvalSecret -}}
{{- $resourceUri := required "auth.resourceUri is required" .Values.auth.resourceUri -}}
{{- if and (not .Values.auth.bearerToken) (not .Values.auth.jwtHs256Secret) (not .Values.auth.jwtJwksUrl) -}}
{{- fail "configure auth.bearerToken, auth.jwtHs256Secret, or auth.jwtJwksUrl" -}}
{{- end -}}
{{- if and .Values.auth.bearerToken (or .Values.auth.jwtHs256Secret .Values.auth.jwtJwksUrl) -}}
{{- fail "static bearer and JWT authentication cannot be enabled together" -}}
{{- end -}}
{{- if or .Values.auth.jwtHs256Secret .Values.auth.jwtJwksUrl -}}
{{- $_ := required "auth.jwtIssuer is required for JWT authentication" .Values.auth.jwtIssuer -}}
{{- $_ := required "auth.jwtAudience is required for JWT authentication" .Values.auth.jwtAudience -}}
{{- $_ := required "auth.authorizationServer is required for JWT authentication" .Values.auth.authorizationServer -}}
{{- end -}}
{{- if .Values.audit.signatureRequired -}}
{{- $_ := required "audit.hmacSecret is required when audit.signatureRequired=true" .Values.audit.hmacSecret -}}
{{- end -}}
{{- if lt (len $approvalSecret) 32 -}}
{{- fail "approvalSecret must be at least 32 bytes; Judikt refuses shorter approval secrets at startup" -}}
{{- end -}}
{{- if and .Values.audit.hmacSecret (lt (len .Values.audit.hmacSecret) 32) -}}
{{- fail "audit.hmacSecret must be at least 32 bytes; Judikt refuses shorter audit keys at startup" -}}
{{- end -}}
{{- if and .Values.audit.hmacSecret (eq .Values.audit.hmacSecret $approvalSecret) -}}
{{- fail "audit.hmacSecret must be independent from approvalSecret" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "judikt.fullname" . }}
  labels:
    {{- include "judikt.labels" . | nindent 4 }}
type: Opaque
stringData:
  JUDIKT_APPROVAL_SECRET: {{ $approvalSecret | quote }}
  JUDIKT_HTTP_BEARER_TOKEN: {{ .Values.auth.bearerToken | quote }}
  JUDIKT_JWT_HS256_SECRET: {{ .Values.auth.jwtHs256Secret | quote }}
  JUDIKT_AUDIT_HMAC_SECRET: {{ .Values.audit.hmacSecret | quote }}
  JUDIKT_ARGUS_API_TOKEN: {{ .Values.argus.apiToken | quote }}
  JUDIKT_ARGUS_HMAC_SECRET: {{ .Values.argus.hmacSecret | quote }}
  JUDIKT_SIEM_TOKEN: {{ .Values.siem.token | quote }}
  JUDIKT_SIEM_HMAC_SECRET: {{ .Values.siem.hmacSecret | quote }}
