{
  "local_stdio_identity": "sre-oncall",
  "identity_argument_fields": [
    "actor"
  ],
  "allow_demo_boolean_approval": false,
  "http": {
    "legacy_call_upstream": true
  },
  "kill_switches": {
    "backend": "sqlite",
    "cache_ttl_seconds": 1.0
  },
  "tool_pinning": {
    "first_use": "auto"
  },
  "kubernetes": {
    "context": "",
    "allow_delete_fallback": false,
    "subprocess_timeout_seconds": 20,
    "verification_timeout_seconds": 180,
    "poll_interval_seconds": 3
  },
  "risk": {
    "tier_scores": {
      "read": 10,
      "write": 10,
      "destructive": 10
    },
    "annotation_modifiers": [],
    "tool_rules": [
      {
        "match": "platform.*",
        "add": 10,
        "evidence": "production operations server"
      },
      {
        "match": "kubernetes.*",
        "add": 20,
        "evidence": "kubernetes operations server"
      },
      {
        "match": "*.rollback_deployment",
        "add": 55,
        "evidence": "deployment rollback can change live production traffic"
      },
      {
        "match": "*.restart_deployment",
        "add": 45,
        "evidence": "deployment restart can affect availability"
      },
      {
        "match": "*.restart_pod",
        "add": 50,
        "evidence": "pod restart can affect production availability"
      },
      {
        "match": "*.run_diagnostic",
        "add": 25,
        "evidence": "diagnostic commands can expose infrastructure details"
      },
      {
        "match": "*.read_config",
        "add": 20,
        "evidence": "configuration may contain secrets"
      },
      {
        "match": "*.read_logs",
        "add": 15,
        "evidence": "logs may include sensitive operational context"
      }
    ],
    "argument_rules": [
      {
        "argument": "service",
        "in": [
          "payments-api"
        ],
        "add": 10,
        "evidence": "payments-api is business critical"
      },
      {
        "argument": "namespace",
        "in": [
          "prod",
          "production"
        ],
        "add": 10,
        "evidence": "request targets a production namespace"
      },
      {
        "argument": "pod",
        "regex": "payment",
        "add": 10,
        "evidence": "request targets a payment-system pod"
      },
      {
        "argument": "version",
        "prefix": "payments-api@",
        "add": 5,
        "evidence": "request references a production release artifact"
      }
    ],
    "levels": {
      "critical": 80,
      "high": 60,
      "medium": 35
    },
    "risk_actions": {}
  },
  "blocked_argument_patterns": [
    "(^|/)\\.ssh(/|$)",
    "(^|/)\\.aws(/|$)",
    "(^|/)\\.env$",
    "id_rsa",
    "BEGIN [A-Z ]*PRIVATE KEY",
    "\\bcurl\\b",
    "\\bwget\\b"
  ],
  "forbidden_argument_keys": [
    "access_token",
    "authorization",
    "bearer_token",
    "oauth_token",
    "upstream_token"
  ],
  "allowed_argument_values": {
    "platform.run_diagnostic": {
      "command": [
        "dependency-health",
        "error-rate",
        "latency-summary"
      ]
    },
    "argus.propose_remediation": {
      "action_type": [
        "collect_diagnostics",
        "restart_service",
        "rollback_config",
        "reload_nginx",
        "clear_redis_keyspace",
        "drain_postgres_connections",
        "revert_feature_flag"
      ],
      "risk": [
        "low",
        "medium"
      ],
      "dry_run": [
        true
      ],
      "advisory_only": [
        true
      ]
    }
  },
  "inbound_content_inspection": {
    "mode": "fail_closed",
    "max_scan_bytes": 262144,
    "max_medium_findings": 3,
    "thresholds": {
      "tool_description": "medium",
      "tool_argument": "medium",
      "tool_result": "high"
    }
  },
  "redacted_key_patterns": [
    "api[_-]?key",
    "authorization",
    "password",
    "secret",
    "token"
  ],
  "redacted_value_patterns": [
    "sk-[A-Za-z0-9_-]{8,}",
    "ghp_[A-Za-z0-9]{8,}",
    "(?<![A-Za-z0-9])(?-i:(?:AKIA|ASIA)[A-Z0-9]{16})(?![A-Za-z0-9])",
    "\\bgithub_pat_[A-Za-z0-9_]{20,}\\b",
    "\\b(?:gho|ghs|ghu|ghr)_[A-Za-z0-9]{20,}\\b",
    "\\bxox[abprs]-[A-Za-z0-9-]{10,}\\b",
    "\\bAIza[A-Za-z0-9_-]{35}\\b",
    "\\b(?:sk_live|rk_live)_[A-Za-z0-9]{16,}\\b",
    "(?i:\\bBearer\\s+)[A-Za-z0-9._~+/=-]{16,}",
    "\\beyJ[A-Za-z0-9_-]*\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\b",
    "\\bhttps?://[^/\\s:@]+:[^@\\s/]+@[^\\s/]+",
    "-----BEGIN [A-Z ]*PRIVATE KEY-----[\\s\\S]*?-----END [A-Z ]*PRIVATE KEY-----"
  ],
  "approval_required": [
    "platform.restart_deployment",
    "platform.rollback_deployment",
    "kubernetes.restart_pod"
  ],
  "actor_permissions": {
    "demo-operator": [
      "platform.*",
      "kubernetes.*",
      "incident.*"
    ],
    "sre-oncall": [
      "platform.*",
      "kubernetes.*",
      "incident.*"
    ],
    "readonly": [
      "platform.health",
      "platform.read_config",
      "platform.read_logs",
      "incident.timeline"
    ],
    "anonymous": [
      "platform.health",
      "platform.read_config",
      "platform.read_logs",
      "platform.run_diagnostic",
      "incident.*",
      "kubernetes.get_pod",
      "kubernetes.rollout_status"
    ],
    "argus-ai-service": [
      "argus.propose_remediation"
    ]
  },
  "actor_required_tools": [
    "argus.propose_remediation",
    "platform.restart_deployment",
    "platform.rollback_deployment",
    "kubernetes.restart_pod"
  ],
  "production_environments": [
    "prod",
    "production"
  ],
  "rollback_plan_required": [
    "platform.restart_deployment",
    "platform.rollback_deployment",
    "kubernetes.restart_pod"
  ],
  "dry_run_supported": [
    "platform.restart_deployment",
    "platform.rollback_deployment",
    "kubernetes.restart_pod"
  ],
  "shadow_mode_supported": [
    "platform.restart_deployment",
    "platform.rollback_deployment",
    "kubernetes.restart_pod"
  ],
  "rate_limits": {
    "backend": "local",
    "max_local_keys": 100000
  },
  "rate_limits_per_minute": {
    "default": 30,
    "platform.health": 10,
    "platform.rollback_deployment": 3,
    "kubernetes.restart_pod": 3
  },
  "global_rate_limit_per_minute": 300,
  "allowed_tools": {
    "platform-ops": [
      "platform.health",
      "platform.read_config",
      "platform.read_logs",
      "platform.run_diagnostic",
      "platform.restart_deployment",
      "platform.rollback_deployment"
    ],
    "kubernetes": [
      "kubernetes.get_pod",
      "kubernetes.restart_pod",
      "kubernetes.rollout_status"
    ],
    "incident": [
      "incident.create",
      "incident.attach_evidence",
      "incident.timeline"
    ],
    "argus-ai": [
      "argus.propose_remediation"
    ]
  }
}
