services:
  judikt-init:
    image: judikt:observability
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /app/data"]
    restart: "no"
    volumes:
      - judikt-data:/app/data

  judikt:
    build:
      context: ../..
    image: judikt:observability
    environment:
      JUDIKT_MODE: real-mcp
      JUDIKT_HTTP_BEARER_TOKEN: local-dev-token
      JUDIKT_APPROVAL_SECRET: ${JUDIKT_APPROVAL_SECRET:?JUDIKT_APPROVAL_SECRET is required}
      JUDIKT_AUDIT_HMAC_SECRET: local-dev-audit-secret
      JUDIKT_AUDIT_SIGNATURE_REQUIRED: "true"
      JUDIKT_AUDIT_VERIFY_ON_STARTUP: "true"
      JUDIKT_REDIS_URL: redis://redis:6379/0
      JUDIKT_REDIS_REQUIRED: "true"
      JUDIKT_TELEMETRY: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "8080:8080"
    volumes:
      - judikt-data:/app/data
    depends_on:
      judikt-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      tempo:
        condition: service_started

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - judikt

  tempo:
    image: grafana/tempo:2.6.1
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200"
      - "4318:4318"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14318:4318"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  judikt-data:
  redis-data:
